name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test standalone workspace
        run: cargo test --workspace --locked
      - name: Check loader without filesystem support
        run: cargo check -p typikon-loader --lib --no-default-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  conformance:
    name: Cross-repository conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out engine
        uses: actions/checkout@v6
        with:
          path: typikon-engine
      - name: Check out GOARCH pack
        uses: actions/checkout@v6
        with:
          repository: jongentsch/typikon-goarch
          path: typikon-goarch
      - name: Check out OCA pack
        uses: actions/checkout@v6
        with:
          repository: jongentsch/typikon-oca
          path: typikon-oca
      - uses: dtolnay/rust-toolchain@stable
      - name: Run golden conformance cases
        working-directory: typikon-engine
        env:
          TYPIKON_GOARCH_PACK: ${{ github.workspace }}/typikon-goarch
          TYPIKON_OCA_PACK: ${{ github.workspace }}/typikon-oca
        run: cargo test -p typikon-core --features conformance --test external_packs --locked
