[package]
name = "typikon-cli"
description = "Development and validation CLI for typikon-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "typikon"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
typikon-core = { path = "../typikon-core" }
typikon-loader = { path = "../typikon-loader", features = ["filesystem"] }
typikon-schema = { path = "../typikon-schema" }

[lints]
workspace = true
