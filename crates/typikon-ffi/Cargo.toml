[package]
name = "typikon-ffi"
description = "Minimal serialized native ABI for typikon-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
typikon-core = { path = "../typikon-core" }
typikon-loader = { path = "../typikon-loader", default-features = false }
typikon-schema = { path = "../typikon-schema" }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
